# Keyball Gestures 設定ファイル (macOS版)

# 仮想タッチパッドの設定（macOSでは使用されませんが、互換性のため保持）
[touchpad]
min_x = 0
max_x = 32767
min_y = 0
max_y = 32767

# キー入力の設定
[input]
# Mouse 4 (1003)を2本指ジェスチャーのトリガーとして使用
two_finger_key = 1003
# Mouse 3 (1002)を4本指ジェスチャーのトリガーとして使用
four_finger_key = 1002

# モーション制御の設定
[motion]
# 0.0-1.0の範囲。1.0に近いほど滑らかになりますが、遅延が大きくなります
filter_smoothing_factor = 0.85
# フィルターが動作し始めるまでのカウント
filter_warm_up_count = 10
# マウス移動量の調整係数（デバッグ用に1.0に設定）
mouse_delta_factor = 1.0

# ジェスチャー認識の設定
[gesture]
# スクロールをリセットするまでの時間 (ミリ秒)
reset_threshold = 50

# デバイス設定
[device_prefs]
# 優先するキーボードデバイス名 (空白の場合は自動検出)
preferred_keyboard_device = ""
# 優先するマウスデバイス名 (空白の場合は自動検出)
preferred_mouse_device = ""